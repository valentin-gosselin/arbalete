<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arbalète</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <!-- The texts come from _locales: data-i18n (text), data-i18n-title,
       data-i18n-placeholder, data-i18n-label (aria-label). -->

  <!-- Sidebar -->
  <section id="favorites" class="favorites" data-i18n-label="favoriteList"></section>

  <main id="tabs" class="tabs" role="list"></main>

  <div id="setup-banner" class="setup-banner" hidden>
    <p data-i18n="bannerText"></p>
    <div class="banner-actions">
      <button id="banner-later" data-i18n="bannerLater"></button>
      <button id="banner-setup" class="primary" data-i18n="bannerSetup"></button>
    </div>
  </div>

  <button id="new-tab" class="new-tab" data-i18n-title="newTab" data-i18n-label="newTab"></button>

  <footer class="footer">
    <div id="spaces" class="spaces" role="toolbar" data-i18n-label="spaceList"></div>
    <div class="tools">
      <button id="archive-button" class="tool" data-i18n-title="archiveTitle" data-i18n-label="archiveTitle"></button>
      <button id="search-button" class="tool" data-i18n-title="paletteButton" data-i18n-label="paletteButton"></button>
      <button id="pin-button" class="tool" hidden></button>
      <button id="settings-button" class="tool" data-i18n-title="settings" data-i18n-label="settings"></button>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Dialogs: shown in an overlay over the page, in the panel under the toolbar button,
       or in a popup window (see "frame" in sidebar.js). data-icon adds a Lucide icon. -->

  <!-- Space editor (?edit=<space> or ?edit=new) -->
  <form id="space-form" class="panel" hidden>
    <header class="dialog-head">
      <h2 id="f-title"></h2>
      <button type="button" class="dialog-close" data-icon="x" data-i18n-title="close" data-i18n-label="close"></button>
    </header>

    <div class="identity">
      <button type="button" id="f-icon-preview" class="icon-preview" aria-haspopup="dialog" aria-expanded="false" data-i18n-title="iconChange" data-i18n-label="iconChange"></button>
      <input id="f-name" class="name-input" required maxlength="40" autocomplete="off" data-i18n-label="name" data-i18n-placeholder="name">
    </div>

    <div id="f-icon-popover" class="popover" role="dialog" data-i18n-label="icon" hidden>
      <input id="f-icon-search" type="search" autocomplete="off" data-i18n-placeholder="iconSearch" data-i18n-label="iconSearch">
      <div id="f-icon-grid" class="icon-grid"></div>
      <div class="popover-foot">
        <button type="button" id="f-icon-upload" class="ghost" data-icon="image-up" data-i18n="iconUpload"></button>
        <span class="hint" data-i18n="iconUploadHint"></span>
      </div>
      <input id="f-icon-file" type="file" accept="image/svg+xml,image/png,image/jpeg,image/webp,image/gif,.svg" hidden>
    </div>

    <section class="card">
      <div class="line">
        <span class="line-label" data-i18n="color"></span>
        <div id="f-colors" class="color-picker"></div>
      </div>
      <div class="line">
        <span class="line-label" data-i18n="spaceBackground"></span>
        <div class="segmented" role="radiogroup" data-i18n-label="spaceBackground">
          <label><input type="radio" name="f-bg" value="none"><span data-i18n="backgroundNone"></span></label>
          <label><input type="radio" name="f-bg" value="color"><span data-i18n="backgroundColor"></span></label>
          <label><input type="radio" name="f-bg" value="gradient"><span data-i18n="backgroundGradient"></span></label>
        </div>
      </div>
      <div class="line" id="f-color2-line">
        <span class="line-label" data-i18n="spaceSecondColor"></span>
        <div id="f-colors2" class="color-picker"></div>
      </div>
      <label class="line">
        <span class="line-label" data-i18n="container"></span>
        <select id="f-container"></select>
      </label>
      <label class="line" id="f-new-container-row" hidden>
        <span class="line-label" data-i18n="newContainerName"></span>
        <input id="f-new-container" maxlength="40">
      </label>
    </section>

    <section class="card">
      <label class="stack">
        <span class="line-label" data-i18n="spaceSites"></span>
        <textarea id="f-sites" rows="2" data-i18n-placeholder="spaceSitesPlaceholder"></textarea>
        <span class="hint" data-i18n="spaceSitesHint"></span>
      </label>
      <label class="line">
        <span class="line-label" data-i18n="spaceSchedule"></span>
        <input type="checkbox" class="switch" id="f-sched-on">
      </label>
      <div class="stack sub" id="f-sched-row">
        <div id="f-sched-slots" class="slots"></div>
        <div class="slot-tools">
          <button type="button" id="f-sched-add" class="ghost" data-icon="plus" data-i18n="scheduleAddSlot"></button>
          <span class="hint" data-i18n="scheduleHint"></span>
        </div>
      </div>
      <label class="line">
        <span class="line-label" data-i18n="archiveAfter"></span>
        <select id="f-archive"></select>
      </label>
    </section>

    <div class="actions">
      <button type="button" id="f-delete" class="danger" data-i18n="delete"></button>
      <span class="grow"></span>
      <button type="button" id="f-cancel" data-i18n="cancel"></button>
      <button type="submit" class="primary" data-i18n="save"></button>
    </div>
  </form>

  <!-- Tab group editor (?group=…) -->
  <form id="group-form" class="panel" hidden>
    <header class="dialog-head">
      <h2 data-i18n="groupFormTitle"></h2>
      <button type="button" class="dialog-close" data-icon="x" data-i18n-title="close" data-i18n-label="close"></button>
    </header>
    <input id="g-title" class="name-input" maxlength="60" autocomplete="off" data-i18n-label="name" data-i18n-placeholder="name">
    <div id="g-colors" class="swatches" role="radiogroup" data-i18n-label="color"></div>
    <div class="actions">
      <span class="grow"></span>
      <button type="button" id="g-cancel" data-i18n="cancel"></button>
      <button type="submit" class="primary" data-i18n="save"></button>
    </div>
  </form>

  <!-- Archive of the active space (?archive=1) -->
  <section id="archive-panel" class="panel" hidden>
    <header class="dialog-head">
      <h2 id="archive-heading"></h2>
      <button type="button" class="dialog-close" data-icon="x" data-i18n-title="close" data-i18n-label="close"></button>
    </header>
    <input id="archive-search" type="search" autocomplete="off" data-i18n-placeholder="archiveSearch" data-i18n-label="archiveSearch">
    <ul id="archive-list" class="archive-list"></ul>
    <div class="actions">
      <button type="button" id="archive-clear" class="danger" data-i18n="archiveClear"></button>
      <span class="grow"></span>
      <button type="button" id="archive-close" data-i18n="archiveClose"></button>
    </div>
  </section>

  <!-- Settings (?settings=1) -->
  <section id="settings-panel" class="panel" hidden>
    <header class="dialog-head">
      <h2 data-i18n="settings"></h2>
      <button type="button" class="dialog-close" data-icon="x" data-i18n-title="close" data-i18n-label="close"></button>
    </header>

    <section class="card">
      <button type="button" class="line action" id="s-new-space" data-icon="plus" data-i18n="newSpace"></button>
      <button type="button" class="line action" id="s-clear" data-icon="brush-cleaning" data-i18n="settingsClearSpace"></button>
    </section>

    <h3 data-i18n="settingsHeading"></h3>
    <section class="card">
      <label class="line"><span class="line-label" data-i18n="settingsExpand"></span><input type="checkbox" class="switch" id="s-expand"></label>
      <label class="line"><span class="line-label" data-i18n="settingsTheme"></span><input type="checkbox" class="switch" id="s-theme"></label>
      <label class="line"><span class="line-label" data-i18n="settingsHistory"></span><input type="checkbox" class="switch" id="s-history"></label>
      <label class="line">
        <span class="stack tight">
          <span class="line-label" data-i18n="settingsExternal"></span>
          <span class="hint" data-i18n="settingsExternalHint"></span>
        </span>
        <select id="s-external"></select>
      </label>
      <label class="line">
        <span class="stack tight">
          <span class="line-label" data-i18n="settingsCenter"></span>
          <span class="hint" data-i18n="settingsCenterHint"></span>
        </span>
        <input type="checkbox" class="switch" id="s-center">
      </label>
      <div class="stack">
        <span class="line-label" data-i18n="settingsSuggest"></span>
        <span class="inline">
          <input id="s-suggest" class="grow" type="url" autocomplete="off" placeholder="https://…/autocompleter?q={searchTerms}">
          <button type="button" id="s-suggest-save" data-i18n="save"></button>
        </span>
        <span class="hint" data-i18n="settingsSuggestHint"></span>
      </div>
    </section>

    <h3 data-i18n="statsHeading"></h3>
    <section class="card">
      <div id="s-stats" class="stats"></div>
    </section>

    <h3 data-i18n="settingsShare"></h3>
    <section class="card">
      <button type="button" class="line action" id="s-share" data-icon="share-2" data-i18n="settingsShareSpaces"></button>
    </section>

    <section class="card">
      <button type="button" class="line action" id="s-setup" data-icon="panel-left" data-i18n="settingsHideNative"></button>
      <button type="button" class="line action" id="s-shortcuts" data-icon="keyboard" data-i18n="settingsShortcuts"></button>
      <button type="button" class="line action" id="s-welcome" data-icon="sparkles" data-i18n="settingsWelcome"></button>
    </section>
  </section>

  <!-- First run assistant, in a tab (?welcome=1) -->
  <section id="welcome-panel" class="panel welcome" hidden>
    <div class="welcome-hero">
      <img src="../icons/arbalete.svg" width="72" height="72" alt="">
      <h1 data-i18n="welcomeTitle"></h1>
      <p data-i18n="welcomeIntro"></p>
    </div>
    <ol class="steps" aria-hidden="true"><li class="current"></li><li></li><li></li></ol>

    <section class="step" id="w-step-1">
      <h2 data-i18n="welcomeSpacesTitle"></h2>
      <div id="w-synced" hidden>
        <p data-i18n="welcomeSynced"></p>
        <section class="card"><div id="w-synced-list" class="pick-list"></div></section>
      </div>
      <div id="w-fresh">
        <p data-i18n="welcomeSpacesIntro"></p>
        <section class="card"><div id="w-starters" class="pick-list"></div></section>
      </div>
      <button type="button" id="w-import" class="ghost" data-icon="upload" data-i18n="welcomeImport"></button>
    </section>

    <section class="step" id="w-step-2" hidden>
      <div id="w-setup-slot"></div>
    </section>

    <section class="step" id="w-step-3" hidden>
      <h2 data-i18n="welcomeOptionsTitle"></h2>
      <section class="card">
        <label class="line">
          <span class="stack tight">
            <span class="line-label" data-i18n="settingsCenter"></span>
            <span class="hint" data-i18n="settingsCenterHint"></span>
          </span>
          <input type="checkbox" class="switch" id="w-center">
        </label>
        <label class="line"><span class="line-label" data-i18n="settingsTheme"></span><input type="checkbox" class="switch" id="w-theme"></label>
        <label class="line"><span class="line-label" data-i18n="settingsHistory"></span><input type="checkbox" class="switch" id="w-history"></label>
      </section>
      <h3 data-i18n="welcomeShortcuts"></h3>
      <section class="card">
        <div class="line"><span class="line-label" data-i18n="cmdPalette"></span><kbd>Alt+K</kbd></div>
        <div class="line"><span class="line-label" data-i18n="welcomeShortcutSpaces"></span><kbd>Alt+1 … Alt+5</kbd></div>
        <div class="line"><span class="line-label" data-i18n="cmdSidebar"></span><kbd data-i18n="welcomeSidebarKey"></kbd></div>
      </section>
    </section>

    <div class="actions">
      <button type="button" id="w-back" data-icon="arrow-left" data-i18n="welcomeBack" hidden></button>
      <span class="grow"></span>
      <button type="button" id="w-next" class="primary" data-i18n="welcomeNext"></button>
    </div>
  </section>

  <!-- Share spaces: export a selection, import a file as a template or a replacement (?share=1) -->
  <section id="share-panel" class="panel" hidden>
    <header class="dialog-head">
      <h2 data-i18n="shareTitle"></h2>
      <button type="button" class="dialog-close" data-icon="x" data-i18n-title="close" data-i18n-label="close"></button>
    </header>

    <h3 data-i18n="shareExport"></h3>
    <section class="card">
      <div id="share-export-list" class="pick-list"></div>
      <label class="line"><span class="line-label" data-i18n="shareWithFavorites"></span><input type="checkbox" class="switch" id="share-favorites" checked></label>
    </section>
    <div class="actions">
      <span class="hint grow" data-i18n="shareExportHint"></span>
      <button type="button" id="share-export" class="primary" data-i18n="shareExportButton"></button>
    </div>

    <h3 data-i18n="shareImport"></h3>
    <section class="card">
      <button type="button" class="line action" id="share-pick" data-icon="upload" data-i18n="sharePick"></button>
      <div id="share-import-list" class="pick-list" hidden></div>
    </section>
    <div class="actions" id="share-import-actions" hidden>
      <button type="button" id="share-replace" class="danger" data-i18n="shareReplace"></button>
      <span class="grow"></span>
      <button type="button" id="share-add" class="primary" data-i18n="shareAdd"></button>
    </div>
  </section>

  <!-- Small window asking for an optional permission (?grant=…) -->
  <section id="grant-panel" class="panel" hidden>
    <header class="dialog-head">
      <h2 id="grant-title"></h2>
      <button type="button" class="dialog-close" data-icon="x" data-i18n-title="close" data-i18n-label="close"></button>
    </header>
    <p id="grant-text"></p>
    <div class="actions">
      <span class="grow"></span>
      <button type="button" id="grant-cancel" data-i18n="cancel"></button>
      <button type="button" id="grant-allow" class="primary" data-i18n="grantAllow"></button>
    </div>
  </section>

  <!-- Hide Firefox's own tabs (?setup=1) -->
  <section id="setup-panel" class="panel" hidden>
    <header class="dialog-head">
      <h2 data-i18n="setupTitle"></h2>
      <button type="button" class="dialog-close" data-icon="x" data-i18n-title="close" data-i18n-label="close"></button>
    </header>
    <p data-i18n="setupIntro"></p>
    <p class="hint" data-i18n="setupHint"></p>

    <div id="setup-windows">
      <button class="wide primary-wide" id="setup-download-script" data-i18n="setupDownloadScript"></button>
      <ol>
        <li data-i18n="setupStep1"></li>
        <li data-i18n="setupStep2"></li>
      </ol>
      <p class="hint" data-i18n="setupRepeat"></p>
    </div>

    <div id="setup-unix" hidden>
      <button class="wide primary-wide" id="setup-unix-download" data-i18n="setupDownloadScriptUnix"></button>
      <ol>
        <li>
          <span data-i18n="setupUnixStep1"></span>
          <span class="command">
            <code id="setup-unix-command"></code>
            <button type="button" id="setup-unix-copy" data-i18n="copy"></button>
          </span>
          <span class="hint" data-i18n="setupUnixDrag"></span>
        </li>
        <li data-i18n="setupStep2"></li>
      </ol>
      <p class="hint" data-i18n="setupRepeat"></p>
    </div>

    <details id="setup-manual">
      <summary data-i18n="setupManualSummary"></summary>
      <ol>
        <li data-i18n="setupManual1"></li>
        <li data-i18n="setupManual2"></li>
        <li data-i18n="setupManual3"></li>
        <li data-i18n="setupManual4"></li>
      </ol>
      <button class="wide" id="setup-download-css" data-i18n="setupDownloadCss"></button>
    </details>
  </section>

  <script src="sidebar.js"></script>
</body>
</html>
